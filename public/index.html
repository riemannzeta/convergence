<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convergence</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Convergence</h1>
            <p class="subtitle">Compare and analyze inconsistencies in responses across models</p>
        </header>

        <div class="input-section">
            <div class="form-group">
                <label for="prompt">Enter your prompt:</label>
                <textarea id="prompt" rows="4"
                    placeholder="Can it really be more energy efficient to build data centers in space all-in? I would think that cooling alone would ruin the efficiency because, while it's colder, it's also a vacuum. How do they handle the cooling more efficiently in, say, low earth orbit?"></textarea>
            </div>

            <div class="form-group">
                <label>Select Models:</label>
                <div id="model-selection" class="model-grid">
                    <p class="loading">Loading available models...</p>
                </div>
            </div>

            <div class="form-group">
                <label for="default-model">Model for Inconsistency Analysis:</label>
                <select id="default-model">
                    <option value="">Select default model...</option>
                </select>
            </div>

            <button id="submit-btn" class="btn btn-primary" disabled>Submit</button>
        </div>

        <div id="rounds-container"></div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
